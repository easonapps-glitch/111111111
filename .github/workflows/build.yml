name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev build-essential
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Initialize Android SDK & Install AIDL
      run: |
        # 1. 強制 Buildozer 下載基本 Android SDK 目錄 structure
        buildozer android debug || true
        
        # 2. 定位 SDK 目錄並手動補齊包含 aidl 的 build-tools
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        else
          SDKMANAGER=$(find $SDK_DIR -name sdkmanager | head -n 1)
        fi
        
        # 3. 安裝包含 aidl 的指定版本 build-tools
        yes | $SDKMANAGER --sdk_root=$SDK_DIR "build-tools;30.0.3" "platforms;android-33"

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: python-game-apk
        path: bin/*.apk
