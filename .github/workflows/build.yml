name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev build-essential
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Fix AIDL path for Buildozer
      run: |
        # 尋找系統內建的 aidl 檔並綁定到 PATH
        AIDL_PATH=$(which aidl || find /usr/local/lib/android/sdk/build-tools -name aidl | head -n 1)
        if [ -n "$AIDL_PATH" ]; then
          mkdir -p ~/.local/bin
          ln -s "$AIDL_PATH" ~/.local/bin/aidl
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: python-game-apk
        path: bin/*.apk
